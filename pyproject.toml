[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-note-intelligence"
version = "0.2.0"
description = "Three-era clinical NLP demo: rule-based → LLM → multimodal extraction of ICD-10/HCC findings (Cotiviti GenAI Science demonstration)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Akhil Gorantala", email = "akhilgorantala1@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36.0"]
notebooks = ["jupyter>=1.0.0"]
build = ["python-docx>=1.1.0", "python-pptx>=0.6.23"]
dev = ["pytest>=7.0.0"]

[project.scripts]
cni = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
